{% extends 'base.html' %}

{% block title %}
    User Login
{% endblock %}

{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <h2 class="mb-4 text-center">User Login</h2>

      <form action="." method="POST" class="card p-4 shadow-sm">
        {% csrf_token %}
        <table class="table mb-3">
          {{ form.as_table }}
        </table>

        <!-- Login button -->
        <div class="d-grid mb-3">
          <button type="submit" class="btn btn-primary">
            Submit
          </button>
        </div>

        <!-- Signup area -->
        <div class="text-center">
          <p class="mb-1">Don't have an account?</p>
          <p class="mb-3">Create one below!</p>

          <div class="d-flex justify-content-center gap-2 flex-wrap">
            <a href="{% url 'register_buyer' %}" class="tf-btn tf-btn-ghost">Sign up (buyer)</a>
            <a href="{% url 'register_seller' %}" class="tf-btn tf-btn-ghost">Sign up (seller)</a>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
